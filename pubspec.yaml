name: sacco_ledger
description: Audit trail and records for savings groups and SACCOs. The app never holds members' money.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.18.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.0
  pdf: ^3.11.0
  printing: ^5.13.0
  local_auth: ^3.0.2
  file_picker: ^13.3.2
  image: ^4.12.0
  share_plus: ^13.3.1
  crypto: ^3.0.8
  qr: ^3.0.2
  fl_chart: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brands/
    - docs/PRIVACY.md
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
