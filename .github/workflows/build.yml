# The build robot. Every push: checks code, runs money tests, builds Android, iOS and web.
# Keys come from GitHub: Settings > Secrets and variables > Actions > Variables.
name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: x }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Money and security rules
        env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: x }
        run: bash supabase/tests/run.sh

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Android test app (APK)
        run: flutter build apk --release --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }} --dart-define=SUPABASE_KEY=${{ vars.SUPABASE_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: build/app/outputs/flutter-apk/app-release.apk }
      - name: Admin web app (PWA)
        run: flutter build web --release --no-web-resources-cdn --base-href "/${{ github.event.repository.name }}/" --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }} --dart-define=SUPABASE_KEY=${{ vars.SUPABASE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: build/web }
      # Second copy for your own site (Cloudflare Pages). It lives at the site root, so no /SACCO-LEDGER/ path.
      - name: Admin web app for Cloudflare
        run: flutter build web --release --no-web-resources-cdn -o build/web_root --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }} --dart-define=SUPABASE_KEY=${{ vars.SUPABASE_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: web-root, path: build/web_root }

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - name: iOS build check (no signing)
        run: flutter build ios --release --no-codesign --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }} --dart-define=SUPABASE_KEY=${{ vars.SUPABASE_KEY }}

  deploy-web:
    if: github.ref == 'refs/heads/main' && vars.SUPABASE_URL != ''
    needs: [database, app]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # Only runs after you add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets.
  deploy-cloudflare:
    if: github.ref == 'refs/heads/main' && vars.SUPABASE_URL != '' && vars.CLOUDFLARE_PROJECT != ''
    needs: [database, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: web-root, path: web_root }
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web_root --project-name=${{ vars.CLOUDFLARE_PROJECT }} --branch=main
