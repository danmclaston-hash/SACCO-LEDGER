# The build robot. Every push: checks code, runs money tests, builds Android, iOS and web.
# Database keys are built into lib/core/config.dart (public keys only).
name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: x }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Money and security rules
        env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: x }
        run: bash supabase/tests/run.sh

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Android test app (APK)
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: build/app/outputs/flutter-apk/app-release.apk }
      - name: Admin web app (PWA)
        run: flutter build web --release --no-web-resources-cdn --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with: { path: build/web }
      # Second copy for your own site (Cloudflare Pages). It lives at the site root, so no /SACCO-LEDGER/ path.
      - name: Admin web app for Cloudflare
        run: flutter build web --release --no-web-resources-cdn -o build/web_root
      - uses: actions/upload-artifact@v4
        with: { name: web-root, path: build/web_root }

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - name: iOS build check (no signing)
        run: flutter build ios --release --no-codesign

  deploy-web:
    if: github.ref == 'refs/heads/main'
    needs: [database, app]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # Your own site on Cloudflare Pages. Runs only once the two Cloudflare secrets are added (README Step 5b).
  # Makes the Pages project by itself the first time, so there is nothing to click in Cloudflare.
  deploy-cloudflare:
    if: github.ref == 'refs/heads/main'
    needs: [database, app]
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: ${{ vars.CLOUDFLARE_PROJECT || 'sacco-ledger' }}
    steps:
      - name: Cloudflare connected?
        id: cf
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not added yet. Skipping. See README Step 5b."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cf.outputs.ready == 'yes'
        uses: actions/download-artifact@v4
        with: { name: web-root, path: web_root }
      - if: steps.cf.outputs.ready == 'yes'
        name: Make the Pages project (first time only)
        run: npx --yes wrangler@3 pages project create "$PROJECT" --production-branch=main || echo "Project already there."
      - if: steps.cf.outputs.ready == 'yes'
        name: Upload the site
        run: npx --yes wrangler@3 pages deploy web_root --project-name="$PROJECT" --branch=main
